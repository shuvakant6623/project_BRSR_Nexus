name: brsr-portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brsr}
      POSTGRES_DB: ${POSTGRES_DB:-brsr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brsr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (RustFS — actively maintained, same S3 API
  # and ports as MinIO; buckets are private by default)
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-brsr}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-brsr-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brsr}:${POSTGRES_PASSWORD:-brsr}@postgres:5432/${POSTGRES_DB:-brsr}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-brsr}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-brsr-secret}
      S3_BUCKET: ${S3_BUCKET:-brsr-evidence}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-32b}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brsr}:${POSTGRES_PASSWORD:-brsr}@postgres:5432/${POSTGRES_DB:-brsr}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-brsr}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-brsr-secret}
      S3_BUCKET: ${S3_BUCKET:-brsr-evidence}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-32b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  s3_data:
